[project]
name = "appsgain-ai-service"
version = "0.1.0"
description = "LLM orchestration, speech-to-text and text-to-speech for Appsgain AI voice calls"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
